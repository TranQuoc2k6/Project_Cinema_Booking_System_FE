<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Chiếu Phim - Cinema Booking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070a12',
                            card: '#0f172a',
                            cyan: '#06b6d4',
                            rose: '#f43f5e',
                            purple: '#8b5cf6',
                            gold: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070a12; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-[10px] mx-[10px] rounded-2xl z-50 glass-panel border border-slate-800/80">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-cyan-400 p-[2px]">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-cube text-cyan-400 text-xl"></i>
                    </div>
                </div>
                <span class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-rose-500">
                    CINEMA<span class="text-white font-light">3D</span>
                </span>
            </a>
            <nav class="hidden md:flex gap-8">
                <a href="../index.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400">Trang chủ</a>
                <a href="movies.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400">Phim Chiếu</a>
                <a href="showtimes.html" class="text-sm font-semibold text-cyan-400">Lịch Chiếu</a>
                <a href="booking.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400">Đặt Vé</a>
            </nav>
            <div id="header-auth-section">
                <a href="login.html" class="px-4 py-2 rounded-full glass-panel text-xs font-semibold text-slate-300 hover:text-white">Đăng Nhập</a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
        <!-- Date Selector & Cinema Filter -->
        <div class="glass-panel p-6 rounded-3xl border border-slate-800/80 mb-8">
            <h1 class="text-2xl sm:text-3xl font-black text-white uppercase mb-4 flex items-center gap-3">
                <span class="w-3 h-8 bg-gradient-to-b from-cyan-400 to-rose-500 rounded-full inline-block"></span>
                Lịch Chiếu Toàn Hệ Thống 3D
            </h1>
            
            <!-- 7 Days Tabs -->
            <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-none" id="days-tabs">
                <!-- Sẽ render bằng JS -->
            </div>
        </div>

        <!-- Showtimes List by Cinema -->
        <div id="showtimes-content" class="space-y-6">
            <!-- Render danh sách rạp và suất chiếu -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>

    <script>
        const days = [];
        const today = new Date();
        for (let i = 0; i < 7; i++) {
            const d = new Date(today);
            d.setDate(today.getDate() + i);
            days.push(d);
        }

        let selectedDateIndex = 0;

        function renderDaysTabs() {
            const tabs = document.getElementById('days-tabs');
            const dayNames = ['CN', 'Th 2', 'Th 3', 'Th 4', 'Th 5', 'Th 6', 'Th 7'];
            tabs.innerHTML = days.map((d, idx) => {
                const isSelected = idx === selectedDateIndex;
                const formattedDate = `${d.getDate()}/${d.getMonth() + 1}`;
                const label = idx === 0 ? 'Hôm nay' : (idx === 1 ? 'Ngày mai' : dayNames[d.getDay()]);
                return `
                    <button onclick="selectDate(${idx})" class="px-5 py-3 rounded-2xl flex flex-col items-center justify-center shrink-0 border transition-all ${isSelected ? 'bg-cyan-500 border-cyan-400 text-slate-950 font-black shadow-lg shadow-cyan-500/25' : 'bg-slate-900/80 border-slate-800 text-slate-300 hover:border-slate-700 font-semibold'}">
                        <span class="text-xs uppercase">${label}</span>
                        <span class="text-base font-black">${formattedDate}</span>
                    </button>
                `;
            }).join('');
        }

        function selectDate(idx) {
            selectedDateIndex = idx;
            renderDaysTabs();
            loadShowtimesData();
        }

        function loadShowtimesData() {
            const container = document.getElementById('showtimes-content');
            // Dữ liệu mẫu phong phú
            const mockCinemas = [
                {
                    name: 'CGV Vincom Center Bà Triệu',
                    city: 'Hà Nội',
                    movies: [
                        { id: 1, title: 'Mai (18+)', format: '2D Digital', times: ['09:00', '12:30', '15:15', '18:30', '21:00'] },
                        { id: 3, title: 'Dune: Hành Tinh Cát 2', format: 'IMAX 3D Laser', times: ['10:00', '14:00', '18:00', '21:30'] }
                    ]
                },
                {
                    name: 'CGV Landmark 81',
                    city: 'TP. Hồ Chí Minh',
                    movies: [
                        { id: 2, title: 'Lật Mặt 7: Một Điều Ước', format: 'Dolby Atmos', times: ['11:00', '14:30', '17:45', '20:30'] },
                        { id: 4, title: 'Quật Mộ Trùng Ma (Exhuma)', format: '4DX 3D', times: ['13:00', '16:15', '19:30', '22:15'] }
                    ]
                }
            ];

            container.innerHTML = mockCinemas.map(c => `
                <div class="glass-panel p-6 rounded-3xl border border-slate-800/80">
                    <div class="flex items-center gap-3 border-b border-slate-800 pb-4 mb-4">
                        <i class="fa-solid fa-location-dot text-rose-500 text-lg"></i>
                        <div>
                            <h3 class="text-lg font-black text-white">${c.name}</h3>
                            <p class="text-xs text-slate-400">${c.city}</p>
                        </div>
                    </div>
                    <div class="space-y-6">
                        ${c.movies.map(m => `
                            <div>
                                <div class="flex items-center gap-2 mb-2">
                                    <h4 class="text-sm font-bold text-slate-200">${m.title}</h4>
                                    <span class="text-[10px] font-black px-2 py-0.5 rounded bg-cyan-950 text-cyan-400 border border-cyan-500/30">${m.format}</span>
                                </div>
                                <div class="flex flex-wrap gap-2.5">
                                    ${m.times.map(t => `
                                        <a href="booking.html?movieId=${m.id}&time=${t}&cinema=${encodeURIComponent(c.name)}" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-cyan-500 hover:text-slate-950 text-xs font-bold text-slate-300 border border-slate-700 transition-all">
                                            ${t}
                                        </a>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        window.onload = function() {
            renderDaysTabs();
            loadShowtimesData();
        };
    </script>
</body>
</html>
