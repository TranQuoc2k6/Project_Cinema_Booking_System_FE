<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Phim - LUMEN CINEMA</title>

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Design System & Page Styles -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/movie-detail.css">

    <!-- Tailwind CSS with LUMEN Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0b0d12',
                            surface: '#131722',
                            card: '#131722',
                            chrome: '#1f2433',
                            tangerine: '#ff5e1e',
                            lime: '#d4ff00',
                            gold: '#e6ca85',
                            violet: '#7c3aed'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #f8fafc;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .glass-panel {
            background: rgba(19, 23, 34, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative bg-[#0b0d12]">

    <!-- Ambient Hero Backdrop Image & Gradient -->
    <div id="movie-hero-backdrop" class="movie-hero-backdrop"></div>
    <div class="movie-hero-gradient"></div>

    <!-- Header Navigation -->
    <header class="sticky top-[10px] mx-[10px] rounded-2xl z-50 glass-panel border border-white/10 transition-all duration-300">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#ff5e1e] via-[#d4ff00] to-[#7c3aed] p-[2px] transform group-hover:rotate-12 transition-transform duration-300 shadow-[0_0_15px_rgba(255,94,30,0.5)]">
                    <div class="w-full h-full bg-[#0b0d12] rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid font-black fa-cube text-[#d4ff00] text-xl group-hover:scale-110 transition-transform"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-[#ff5e1e] via-[#d4ff00] to-white">
                        LUMEN<span class="text-white font-light">CINEMA</span>
                    </span>
                    <span class="text-[9px] uppercase tracking-widest text-[#d4ff00] -mt-1 font-semibold">Studio & Theater HQ</span>
                </div>
            </a>

            <nav class="hidden md:flex flex-1 justify-center items-center gap-6 lg:gap-8">
                <a href="../index.html" class="text-sm font-medium text-slate-300 hover:text-[#ff5e1e] flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-house text-xs"></i> Trang chủ
                </a>
                <a href="movies.html" class="text-sm font-semibold text-[#ff5e1e] flex items-center gap-1.5">
                    <i class="fa-solid fa-film text-xs"></i> Phim Chiếu
                </a>
                <a href="showtimes.html" class="text-sm font-medium text-slate-300 hover:text-[#ff5e1e] flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-calendar-days text-xs"></i> Lịch Chiếu
                </a>
            </nav>

            <div class="flex items-center gap-3" id="header-auth-section">
                <a href="login.html" class="px-4 py-2 rounded-full glass-panel text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
                    Đăng Nhập
                </a>
                <a href="register.html" class="px-4 py-2 rounded-full bg-gradient-to-r from-[#ff5e1e] to-[#ea580c] text-xs font-bold text-white shadow-md hover:brightness-110 transition-all">
                    Đăng Ký
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl mx-auto px-4 py-8 sm:py-12 w-full relative z-10" id="movie-detail-content">
        <!-- Nội dung sẽ được render động bởi js/pages/movie-detail.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-[#0b0d12] border-t border-white/10 text-slate-400 py-8 text-center text-xs font-mono relative z-10 mt-auto">
        <p>© 2026 LUMEN CINEMA & STUDIO HQ. All rights reserved.</p>
    </footer>

    <!-- Toast Notification Container -->
    <div id="cinema-toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/format.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/services/movie.service.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/pages/movie-detail.js"></script>
</body>
</html>
