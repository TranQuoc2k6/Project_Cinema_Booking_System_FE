<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Phim - Cinema Booking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070a12',
                            card: '#0f172a',
                            cyan: '#06b6d4',
                            rose: '#f43f5e',
                            purple: '#8b5cf6',
                            gold: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070a12; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-[10px] mx-[10px] rounded-2xl z-50 glass-panel border border-slate-800/80">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-cyan-400 p-[2px]">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-cube text-cyan-400 text-xl"></i>
                    </div>
                </div>
                <span class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-rose-500">
                    CINEMA<span class="text-white font-light">3D</span>
                </span>
            </a>
            <nav class="hidden md:flex gap-8">
                <a href="../index.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400">Trang chủ</a>
                <a href="movies.html" class="text-sm font-semibold text-cyan-400">Phim Chiếu</a>
                <a href="showtimes.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400">Lịch Chiếu</a>
                <a href="booking.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400">Đặt Vé</a>
            </nav>
            <div id="header-auth-section">
                <a href="login.html" class="px-4 py-2 rounded-full glass-panel text-xs font-semibold text-slate-300 hover:text-white">Đăng Nhập</a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full" id="movie-detail-content">
        <!-- Render dữ liệu phim -->
        <div class="glass-panel p-8 rounded-3xl border border-slate-800/80 flex flex-col md:flex-row gap-8 items-center justify-center min-h-[400px]">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-cyan-400"></i>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id') || '1';

        async function loadMovieDetail() {
            let movie = null;
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/movies/${movieId}`);
                if (res.ok) movie = await res.json();
            } catch (e) {
                console.log('Không lấy được movie từ API');
            }

            if (!movie) {
                movie = {
                    id: movieId,
                    title: 'Dune: Hành Tinh Cát 2',
                    duration_minutes: 166,
                    status: 'NOW_SHOWING',
                    release_date: '2024-03-01',
                    poster_url: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000',
                    trailer_url: 'https://www.youtube.com',
                    description: 'Paul Atreides liên minh cùng Chani và người Fremen trên hành trình báo thù những kẻ đã hủy diệt gia tộc anh. Đứng trước sự lựa chọn giữa tình yêu và số phận vũ trụ, anh phải ngăn chặn một tương lai tăm tối mà chỉ anh mới có thể thấy trước.'
                };
            }

            document.title = `${movie.title} - Cinema 3D`;
            document.getElementById('movie-detail-content').innerHTML = `
                <div class="glass-panel rounded-3xl border border-slate-800/80 overflow-hidden shadow-2xl flex flex-col lg:flex-row">
                    <div class="w-full lg:w-2/5 h-[460px] lg:h-auto relative">
                        <img src="${movie.poster_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000'}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent lg:bg-gradient-to-r lg:from-transparent lg:to-slate-950"></div>
                    </div>
                    <div class="w-full lg:w-3/5 p-6 sm:p-10 flex flex-col justify-between">
                        <div>
                            <div class="flex items-center gap-3 mb-4">
                                <span class="bg-cyan-500 text-slate-950 text-xs font-black px-3 py-1 rounded-md uppercase">3D IMAX</span>
                                <span class="bg-slate-900 border border-slate-700 px-3 py-1 rounded-md text-xs font-bold text-amber-400">★ 9.0 Đánh giá</span>
                            </div>
                            <h1 class="text-3xl sm:text-4xl font-black text-white uppercase tracking-tight mb-2">${movie.title}</h1>
                            <div class="flex items-center gap-6 text-xs text-slate-400 mb-6">
                                <span><i class="fa-regular fa-clock text-cyan-400 mr-1.5"></i> ${movie.duration_minutes || 120} Phút</span>
                                <span><i class="fa-regular fa-calendar text-cyan-400 mr-1.5"></i> Khởi chiếu: ${movie.release_date || 'Đang cập nhật'}</span>
                            </div>
                            <p class="text-sm text-slate-300 leading-relaxed mb-6">${movie.description || 'Nội dung phim đang được cập nhật...'}</p>
                        </div>
                        <div class="pt-6 border-t border-slate-800 flex flex-col sm:flex-row gap-4">
                            <a href="booking.html?movieId=${movie.id}" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-cyan-400 via-teal-400 to-emerald-400 text-slate-950 font-black text-xs uppercase tracking-wider text-center shadow-lg shadow-cyan-400/25 hover:brightness-110 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-ticket text-sm"></i>
                                <span>CHỌN SUẤT CHIẾU & ĐẶT VÉ</span>
                            </a>
                            <a href="${movie.trailer_url || '#'}" target="_blank" class="px-6 py-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase text-center border border-slate-700 transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-play text-xs text-rose-500"></i> Xem Trailer
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            if (window.StorageService && window.StorageService.isAuthenticated()) {
                const user = window.StorageService.getUser();
                document.getElementById('header-auth-section').innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-300">${user.full_name || user.email}</span>
                        <a href="profile.html" class="w-8 h-8 rounded-full border border-cyan-400 flex items-center justify-center bg-slate-900 text-cyan-400 text-xs font-bold"><i class="fa-solid fa-user"></i></a>
                    </div>
                `;
            }
            loadMovieDetail();
        };
    </script>
</body>
</html>
