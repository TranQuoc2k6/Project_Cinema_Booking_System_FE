<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Phim Chiếu Rạp - LUMEN CINEMA</title>
    <!-- Favicon / Tab Icon -->
    <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">
    <link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/images/logo/apple-touch-icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0b0d12',
                            surface: '#131722',
                            card: '#131722',
                            chrome: '#1f2433',
                            tangerine: '#ff5e1e',
                            lime: '#d4ff00',
                            gold: '#e6ca85',
                            violet: '#7c3aed',
                            cyan: '#ff5e1e',
                            rose: '#d4ff00',
                            purple: '#7c3aed'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/pages/movies.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(19, 23, 34, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(25, 30, 45, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover {
            border-color: rgba(255, 94, 30, 0.5);
            box-shadow: 0 0 25px rgba(255, 94, 30, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

            <!-- Header / Navigation Bar (Chuẩn 100% giống index.html) -->
        <header id="main-header" class="sticky top-2 sm:top-[10px] mx-1 sm:mx-[10px] rounded-2xl z-50 glass-panel border border-white/10 transition-all duration-300">
            <div class="w-full px-2 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
                
                <!-- Logo 3D Glow (Đầy đủ logo & chữ trên mọi màn hình Mobile S, M, L, Tablet, Desktop) -->
                <a href="../index.html" class="flex items-center gap-1.5 min-[360px]:gap-2 sm:gap-2.5 lg:gap-3 group shrink-0">
                    <img src="../assets/images/logo/logo.png" alt="LUMEN CINEMA" class="w-6 h-6 min-[360px]:w-7 min-[360px]:h-7 sm:w-8 sm:h-8 lg:w-10 lg:h-10 object-contain shrink-0 drop-shadow-[0_0_12px_rgba(255,180,0,0.45)] group-hover:scale-105 transition-transform duration-300">
                    <div class="flex flex-col shrink-0">
                        <span class="text-[12px] min-[360px]:text-[13px] min-[400px]:text-sm sm:text-lg lg:text-2xl font-black tracking-wide sm:tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-[#ff5e1e] via-[#d4ff00] to-white leading-none sm:leading-tight whitespace-nowrap pr-1">
                            LUMEN<span class="text-white font-light">CINEMA</span>
                        </span>
                        <span class="text-[6.5px] min-[360px]:text-[7.5px] sm:text-[9px] uppercase tracking-widest text-[#d4ff00] font-semibold block leading-tight mt-0.5 whitespace-nowrap">Studio & Theater HQ</span>
                    </div>
                </a>

                <!-- Navigation Links (Chỉ hiển thị trên Desktop >= 1024px để iPad 768px không bị chèn chữ) -->
                <nav class="hidden lg:flex flex-1 justify-center items-center gap-4 xl:gap-8 px-4">
                    <a href="../index.html" class="text-xs lg:text-sm font-medium text-slate-300 hover:text-[#ff5e1e] transition-colors flex items-center gap-1 lg:gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-house text-xs"></i> Trang chủ
                    </a>
                    <a href="movies.html" class="text-xs lg:text-sm font-medium text-slate-300 hover:text-[#ff5e1e] transition-colors flex items-center gap-1 lg:gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-film text-xs"></i> Phim Chiếu
                    </a>
                    <a href="showtimes.html" class="text-xs lg:text-sm font-medium text-slate-300 hover:text-[#ff5e1e] transition-colors flex items-center gap-1 lg:gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-calendar-days text-xs"></i> Lịch Chiếu
                    </a>
                </nav>

                <!-- Action Buttons / User Profile + Mobile Nav Toggle -->
                <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
                    <div class="flex items-center gap-1.5 sm:gap-2.5" id="header-auth-section">
                        <!-- Nút Đăng Nhập (Mobile: icon button tròn viền gradient neon, sm+: pill mở rộng có chữ) -->
                        <a href="login.html" class="relative group p-[1px] rounded-full overflow-hidden focus:outline-none shrink-0" title="Đăng Nhập">
                            <span class="absolute inset-0 bg-gradient-to-r from-[#d4ff00] to-[#ff5e1e] opacity-80 group-hover:opacity-100 transition-opacity"></span>
                            <div class="relative w-7 h-7 sm:w-auto sm:px-3.5 py-1 sm:py-1.5 rounded-full bg-[#030508] flex items-center justify-center gap-1.5 text-xs font-semibold text-white group-hover:bg-[#0b0f19] transition-colors">
                                <i class="fa-solid fa-arrow-right-to-bracket text-[#ff5e1e] text-xs"></i>
                                <span class="hidden sm:inline whitespace-nowrap">Đăng Nhập</span>
                            </div>
                        </a>
                        <!-- Nút Đăng Ký (Mobile: icon button tròn viền gradient neon, sm+: pill mở rộng có chữ) -->
                        <a href="register.html" class="relative group p-[1px] rounded-full overflow-hidden focus:outline-none shrink-0" title="Đăng Ký">
                            <span class="absolute inset-0 bg-gradient-to-r from-[#ff5e1e] to-[#d4ff00] group-hover:opacity-100 transition-opacity"></span>
                            <div class="relative w-7 h-7 sm:w-auto sm:px-3.5 py-1 sm:py-1.5 rounded-full bg-[#030508] flex items-center justify-center gap-1.5 text-xs font-semibold text-white group-hover:bg-[#0b0f19] transition-colors">
                                <i class="fa-solid fa-user-plus text-[#d4ff00] text-xs"></i>
                                <span class="hidden sm:inline whitespace-nowrap">Đăng Ký</span>
                            </div>
                        </a>
                    </div>

                    <!-- Nút menu mobile & tablet tinh tế (< 1024px) -->
                    <button id="mobile-nav-toggle" type="button" aria-label="Mở menu" class="lg:hidden flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-xl glass-pill text-slate-300 hover:text-white border border-white/10 hover:border-[#ff5e1e]/50 transition-colors shrink-0">
                        <i class="fa-solid fa-bars text-xs sm:text-sm"></i>
                    </button>
                </div>

            </div>

            <!-- Mobile & Tablet Dropdown Navigation (< 1024px) -->
            <div id="mobile-nav-menu" class="hidden lg:hidden px-4 pb-4 pt-1 border-t border-white/10 flex-col gap-1.5">
                <a href="../index.html" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-house w-4 text-center"></i> Trang chủ
                </a>
                <a href="movies.html" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-film w-4 text-center text-cyan-400"></i> Phim Chiếu Rạp
                </a>
                <a href="showtimes.html" class="px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:text-white hover:bg-white/5 flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-calendar-days w-4 text-center text-[#d4ff00]"></i> Lịch Chiếu Phim
                </a>
            </div>
        </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-3 sm:px-4 py-6 sm:py-10 w-full">
        
        <!-- Header Banner & Filters -->
        <div class="glass-panel p-4 sm:p-8 rounded-2xl sm:rounded-3xl border border-slate-800/80 mb-6 sm:mb-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 sm:gap-6">
                <div>
                    <h1 class="text-xl sm:text-2xl md:text-3xl font-black text-white uppercase tracking-tight flex items-center gap-2.5 sm:gap-3">
                        <span class="w-2.5 sm:w-3 h-6 sm:h-8 bg-gradient-to-b from-[#ff5e1e] to-[#d4ff00] rounded-full inline-block"></span>
                        Khám Phá Phim Điện Ảnh
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-400 mt-1">Cập nhật liên tục các siêu phẩm bom tấn chiếu rạp với đầy đủ định dạng IMAX Laser, ScreenX, Dolby Atmos</p>
                </div>

                <!-- Tabs Filter Status -->
                <div class="filter-tabs-container flex items-center gap-2 bg-[#0b0d12]/90 p-1.5 rounded-2xl border border-white/10 overflow-x-auto no-scrollbar max-w-full">
                    <button data-status="ALL" onclick="filterMovies('ALL', this)" class="filter-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-[#ff5e1e] to-[#ea580c] text-white shadow-[0_0_15px_rgba(255,94,30,0.4)]">Tất Cả</button>
                    <button data-status="now_showing" onclick="filterMovies('now_showing', this)" class="filter-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Đang Chiếu</button>
                    <button data-status="coming_soon" onclick="filterMovies('coming_soon', this)" class="filter-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Sắp Chiếu</button>
                </div>
            </div>

            <!-- Search bar -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Tìm kiếm tên phim, đạo diễn..." class="w-full bg-[#0b0d12]/90 border border-white/10 text-slate-200 text-xs rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-[#ff5e1e]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-xs text-slate-500"></i>
                </div>
                <select id="genre-select" onchange="handleSearch()" class="bg-[#0b0d12]/90 border border-white/10 text-slate-200 text-xs rounded-xl py-3 px-4 focus:outline-none focus:border-[#ff5e1e]">
                    <option value="">Tất cả thể loại</option>
                    <option value="Hành Động">Hành Động</option>
                    <option value="Tình Cảm">Tình Cảm</option>
                    <option value="Kinh Dị">Kinh Dị</option>
                    <option value="Hoạt Hình">Hoạt Hình</option>
                </select>
            </div>
        </div>

        <!-- Movie List Container (2 cột trên mobile, 3 cột tablet, 4 cột desktop) -->
        <div id="movies-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
            <!-- Render động bằng JS -->
        </div>

        <!-- Pagination Container -->
        <div id="movies-pagination" class="mt-10 flex flex-col sm:flex-row items-center justify-between gap-4"></div>

    </main>

    <!-- FOOTER (Quản lý tập trung từ js/components/footer.js) -->
    <footer id="main-footer" class="relative z-10 bg-[#0b0d12] border-t border-white/10 text-slate-400 pt-12 pb-8 mt-auto"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/format.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/services/movie.service.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/components/footer.js"></script>
    <script src="../js/pages/movies.js"></script>
</body>
</html>
