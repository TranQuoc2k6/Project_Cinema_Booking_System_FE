<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khám Phá Phim Chiếu Rạp - LUMEN CINEMA</title>
    <!-- Favicon / Tab Icon -->
    <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">
    <link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/images/logo/apple-touch-icon.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0b0d12',
                            surface: '#131722',
                            card: '#131722',
                            chrome: '#1f2433',
                            tangerine: '#ff5e1e',
                            lime: '#d4ff00',
                            gold: '#e6ca85',
                            violet: '#7c3aed',
                            cyan: '#ff5e1e',
                            rose: '#d4ff00',
                            purple: '#7c3aed'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d12;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(19, 23, 34, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(25, 30, 45, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover {
            border-color: rgba(255, 94, 30, 0.5);
            box-shadow: 0 0 25px rgba(255, 94, 30, 0.25);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-[10px] mx-[10px] rounded-2xl z-50 glass-panel border border-white/10 transition-all duration-300">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3 group">
                <img src="../assets/images/logo/logo.png" alt="LUMEN CINEMA" class="w-10 h-10 object-contain drop-shadow-[0_0_12px_rgba(255,180,0,0.45)] group-hover:scale-105 transition-transform duration-300">
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-[#ff5e1e] via-[#d4ff00] to-white">
                        LUMEN<span class="text-white font-light">CINEMA</span>
                    </span>
                    <span class="text-[9px] uppercase tracking-widest text-[#d4ff00] -mt-1 font-semibold">Studio & Theater HQ</span>
                </div>
            </a>

            <nav class="hidden md:flex flex-1 justify-center items-center gap-6 lg:gap-8">
                <a href="../index.html" class="text-sm font-medium text-slate-300 hover:text-[#ff5e1e] flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-house text-xs"></i> Trang chủ
                </a>
                <a href="movies.html" class="text-sm font-semibold text-[#ff5e1e] flex items-center gap-1.5">
                    <i class="fa-solid fa-film text-xs"></i> Phim Chiếu
                </a>
                <a href="showtimes.html" class="text-sm font-medium text-slate-300 hover:text-[#ff5e1e] flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-calendar-days text-xs"></i> Lịch Chiếu
                </a>
            </nav>

            <div class="flex items-center gap-3" id="header-auth-section">
                <a href="login.html" class="px-4 py-2 rounded-full glass-panel text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
                    Đăng Nhập
                </a>
                <a href="register.html" class="px-4 py-2 rounded-full bg-gradient-to-r from-[#ff5e1e] to-[#ea580c] text-xs font-bold text-white shadow-md hover:brightness-110 transition-all">
                    Đăng Ký
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
        
        <!-- Header Banner & Filters -->
        <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800/80 mb-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-black text-white uppercase tracking-tight flex items-center gap-3">
                        <span class="w-3 h-8 bg-gradient-to-b from-[#ff5e1e] to-[#d4ff00] rounded-full inline-block"></span>
                        Khám Phá Phim Điện Ảnh
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-400 mt-1">Cập nhật liên tục các siêu phẩm bom tấn chiếu rạp với đầy đủ định dạng IMAX Laser, ScreenX, Dolby Atmos</p>
                </div>

                <!-- Tabs Filter Status -->
                <div class="flex items-center gap-2 bg-[#0b0d12]/90 p-1.5 rounded-2xl border border-white/10">
                    <button data-status="ALL" onclick="filterMovies('ALL', this)" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-[#ff5e1e] to-[#ea580c] text-white shadow-[0_0_15px_rgba(255,94,30,0.4)]">Tất Cả</button>
                    <button data-status="now_showing" onclick="filterMovies('now_showing', this)" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Đang Chiếu</button>
                    <button data-status="coming_soon" onclick="filterMovies('coming_soon', this)" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Sắp Chiếu</button>
                </div>
            </div>

            <!-- Search bar -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Tìm kiếm tên phim, đạo diễn..." class="w-full bg-[#0b0d12]/90 border border-white/10 text-slate-200 text-xs rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-[#ff5e1e]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-xs text-slate-500"></i>
                </div>
                <select id="genre-select" onchange="handleSearch()" class="bg-[#0b0d12]/90 border border-white/10 text-slate-200 text-xs rounded-xl py-3 px-4 focus:outline-none focus:border-[#ff5e1e]">
                    <option value="">Tất cả thể loại</option>
                    <option value="Hành Động">Hành Động</option>
                    <option value="Tình Cảm">Tình Cảm</option>
                    <option value="Kinh Dị">Kinh Dị</option>
                    <option value="Hoạt Hình">Hoạt Hình</option>
                </select>
            </div>
        </div>

        <!-- Movie List Container -->
        <div id="movies-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Render động bằng JS -->
        </div>

    </main>

    <!-- FOOTER (Chuẩn Mẫu Điện Ảnh Galaxy Studio & Lumen Cinema) -->
        <!-- FOOTER (Quản lý tập trung từ js/components/footer.js) -->
    <footer id="main-footer" class="relative z-10 bg-[#0b0d12] border-t border-white/10 text-slate-400 pt-12 pb-8 mt-auto"></footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/format.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/services/movie.service.js"></script>
    <script src="../js/components/header.js"></script>
    <script src="../js/pages/movies.js"></script>
</body>
</html>
