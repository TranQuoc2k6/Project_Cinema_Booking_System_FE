<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Phim Chiếu Rạp 3D - Cinema Booking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070a12',
                            card: '#0f172a',
                            cyan: '#06b6d4',
                            rose: '#f43f5e',
                            purple: '#8b5cf6',
                            gold: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a12;
            color: #f8fafc;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-[10px] mx-[10px] rounded-2xl z-50 glass-panel border border-slate-800/80 transition-all duration-300">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 via-purple-600 to-cyan-400 p-[2px] transform group-hover:rotate-12 transition-transform duration-300">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid font-black fa-cube text-cyan-400 text-xl group-hover:scale-110 transition-transform"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-rose-500">
                        CINEMA<span class="text-white font-light">3D</span>
                    </span>
                    <span class="text-[9px] uppercase tracking-widest text-cyan-400/80 -mt-1 font-semibold">Trải Nghiệm Điện Ảnh</span>
                </div>
            </a>

            <nav class="hidden md:flex flex-1 justify-center items-center gap-6 lg:gap-8">
                <a href="../index.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400 flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-house text-xs"></i> Trang chủ
                </a>
                <a href="movies.html" class="text-sm font-semibold text-cyan-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-film text-xs"></i> Phim Chiếu
                </a>
                <a href="showtimes.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400 flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-calendar-days text-xs"></i> Lịch Chiếu
                </a>
                <a href="booking.html" class="text-sm font-medium text-slate-300 hover:text-cyan-400 flex items-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-ticket text-xs"></i> Đặt Vé
                </a>
            </nav>

            <div class="flex items-center gap-3" id="header-auth-section">
                <a href="login.html" class="px-4 py-2 rounded-full glass-panel text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition-colors">
                    Đăng Nhập
                </a>
                <a href="register.html" class="px-4 py-2 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 text-xs font-bold text-slate-950 hover:brightness-110 transition-all">
                    Đăng Ký
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto px-4 py-10 w-full">
        
        <!-- Header Banner & Filters -->
        <div class="glass-panel p-6 sm:p-8 rounded-3xl border border-slate-800/80 mb-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-black text-white uppercase tracking-tight flex items-center gap-3">
                        <span class="w-3 h-8 bg-gradient-to-b from-cyan-400 to-rose-500 rounded-full inline-block"></span>
                        Khám Phá Phim Điện Ảnh
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-400 mt-1">Cập nhật liên tục các siêu phẩm bom tấn chiếu rạp với đầy đủ định dạng 2D, 3D, IMAX</p>
                </div>

                <!-- Tabs Filter Status -->
                <div class="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                    <button onclick="filterMovies('ALL', this)" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-slate-950 shadow">Tất Cả</button>
                    <button onclick="filterMovies('NOW_SHOWING', this)" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Đang Chiếu</button>
                    <button onclick="filterMovies('COMING_SOON', this)" class="filter-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors">Sắp Chiếu</button>
                </div>
            </div>

            <!-- Search bar -->
            <div class="mt-6 flex flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Tìm kiếm tên phim, đạo diễn..." class="w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-cyan-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-xs text-slate-500"></i>
                </div>
                <select id="genre-select" onchange="handleSearch()" class="bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl py-3 px-4 focus:outline-none focus:border-cyan-500">
                    <option value="">Tất cả thể loại</option>
                    <option value="Hành Động">Hành Động</option>
                    <option value="Tình Cảm">Tình Cảm</option>
                    <option value="Kinh Dị">Kinh Dị</option>
                    <option value="Hoạt Hình">Hoạt Hình</option>
                </select>
            </div>
        </div>

        <!-- Movie List Container -->
        <div id="movies-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Render động bằng JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800 text-slate-400 py-8 text-center text-xs">
        <p>© 2026 CINEMA 3D Platform. Bản quyền thuộc về CINEMA3D Inc.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>

    <script>
        let allMovies = [];
        let currentFilter = 'ALL';

        function updateAuthHeader() {
            const authSec = document.getElementById('header-auth-section');
            if (!authSec) return;
            const isAuth = window.StorageService ? window.StorageService.isAuthenticated() : false;
            const user = window.StorageService ? window.StorageService.getUser() : null;

            if (isAuth && user) {
                authSec.innerHTML = `
                    <div class="flex items-center gap-3">
                        <a href="profile.html" class="flex items-center gap-2 text-xs font-semibold text-slate-200 hover:text-cyan-400">
                            <img src="${user.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'}" class="w-8 h-8 rounded-full border border-cyan-500/40 object-cover">
                            <span>${user.full_name || user.email}</span>
                        </a>
                        <button onclick="window.AuthService.logout('login.html')" class="px-3 py-1.5 rounded-full glass-panel text-xs text-slate-400 hover:text-rose-400">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i>
                        </button>
                    </div>
                `;
            }
        }

        async function fetchMovies() {
            try {
                const res = await fetch('http://127.0.0.1:8000/api/v1/movies');
                if (res.ok) {
                    const data = await res.json();
                    allMovies = Array.isArray(data) ? data : (data.items || []);
                }
            } catch (e) {
                console.log('Dùng fallback data');
            }

            if (allMovies.length === 0) {
                allMovies = [
                    { id: 1, title: 'Mai (18+)', duration_minutes: 131, status: 'NOW_SHOWING', release_date: '2024-02-10', poster_url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600', description: 'Câu chuyện tình yêu đầy cảm xúc và trắc trở giữa Mai và Dương.' },
                    { id: 2, title: 'Lật Mặt 7: Một Điều Ước', duration_minutes: 138, status: 'NOW_SHOWING', release_date: '2024-04-26', poster_url: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600', description: 'Tình mẫu tử thiêng liêng và lòng hiếu thảo của những người con.' },
                    { id: 3, title: 'Dune: Hành Tinh Cát 2', duration_minutes: 166, status: 'NOW_SHOWING', release_date: '2024-03-01', poster_url: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600', description: 'Hành trình trả thù và định đoạt tương lai thiên hà của Paul Atreides.' },
                    { id: 4, title: 'Quật Mộ Trùng Ma (Exhuma)', duration_minutes: 134, status: 'NOW_SHOWING', release_date: '2024-03-15', poster_url: 'https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=600', description: 'Bí ẩn ngôi mộ cổ đe dọa sinh mạng của gia tộc giàu có.' },
                    { id: 5, title: 'Kung Fu Panda 4', duration_minutes: 94, status: 'NOW_SHOWING', release_date: '2024-03-08', poster_url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600', description: 'Po đối mặt với thử thách mới để trở thành Thủ lĩnh tâm linh.' },
                    { id: 6, title: 'Deadpool & Wolverine', duration_minutes: 128, status: 'COMING_SOON', release_date: '2026-11-20', poster_url: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600', description: 'Sự kết hợp bùng nổ giữa hai dị nhân biểu tượng của Marvel.' }
                ];
            }

            renderMovies(allMovies);
        }

        function renderMovies(list) {
            const grid = document.getElementById('movies-grid');
            if (list.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500">Không tìm thấy bộ phim nào phù hợp.</div>';
                return;
            }

            grid.innerHTML = list.map(m => `
                <div class="glass-card rounded-2xl overflow-hidden border border-slate-800 hover:-translate-y-2 transition-all duration-300 flex flex-col">
                    <div class="relative h-[320px] overflow-hidden">
                        <img src="${m.poster_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600'}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"></div>
                        <span class="absolute top-3 left-3 ${m.status === 'NOW_SHOWING' ? 'bg-cyan-500 text-slate-950' : 'bg-rose-500 text-white'} text-[10px] font-black px-2 py-0.5 rounded shadow">
                            ${m.status === 'NOW_SHOWING' ? 'ĐANG CHIẾU' : 'SẮP CHIẾU'}
                        </span>
                    </div>
                    <div class="p-4 bg-slate-950/90 flex-1 flex flex-col justify-between">
                        <div>
                            <h4 class="text-base font-bold text-white truncate" title="${m.title}">${m.title}</h4>
                            <div class="flex items-center justify-between text-xs text-slate-400 mt-1 mb-2">
                                <span><i class="fa-regular fa-clock mr-1 text-cyan-400"></i> ${m.duration_minutes || 120}p</span>
                                <span>KC: ${m.release_date || '2026'}</span>
                            </div>
                            <p class="text-xs text-slate-400 line-clamp-2">${m.description || 'Trải nghiệm điện ảnh đỉnh cao.'}</p>
                        </div>
                        <div class="flex gap-2 mt-4 pt-3 border-t border-slate-800/80">
                            <a href="movie-detail.html?id=${m.id}" class="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold text-center border border-slate-700">Chi tiết</a>
                            <a href="booking.html?movieId=${m.id}" class="flex-1 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-black text-center shadow-lg shadow-cyan-500/20">Đặt vé</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterMovies(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = 'filter-btn px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-colors';
            });
            btn.className = 'filter-btn px-4 py-2 rounded-xl text-xs font-bold bg-cyan-500 text-slate-950 shadow';
            handleSearch();
        }

        function handleSearch() {
            const query = (document.getElementById('search-input')?.value || '').toLowerCase().trim();
            const genre = document.getElementById('genre-select')?.value || '';

            const filtered = allMovies.filter(m => {
                const matchStatus = currentFilter === 'ALL' || m.status === currentFilter;
                const matchQuery = !query || m.title.toLowerCase().includes(query) || (m.description && m.description.toLowerCase().includes(query));
                return matchStatus && matchQuery;
            });

            renderMovies(filtered);
        }

        window.onload = function() {
            updateAuthHeader();
            fetchMovies();
        };
    </script>
</body>
</html>
