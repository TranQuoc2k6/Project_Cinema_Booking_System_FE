<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Vé 3D - Cinema Booking System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070a12',
                            card: '#0f172a',
                            cyan: '#06b6d4',
                            rose: '#f43f5e',
                            purple: '#8b5cf6',
                            gold: '#f59e0b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070a12; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="sticky top-[10px] mx-[10px] rounded-2xl z-50 glass-panel border border-slate-800/80">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-cyan-400 p-[2px]">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid fa-cube text-cyan-400 text-xl"></i>
                    </div>
                </div>
                <span class="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-rose-500">
                    CINEMA<span class="text-white font-light">3D</span>
                </span>
            </a>
            <span class="text-xs uppercase tracking-widest text-cyan-400 font-bold">Thanh Toán An Toàn</span>
        </div>
    </header>

    <!-- Main Payment -->
    <main class="flex-1 max-w-4xl mx-auto px-4 py-10 w-full">
        <div class="glass-panel p-6 sm:p-10 rounded-3xl border border-slate-800/80 shadow-2xl">
            <h1 class="text-2xl font-black text-white uppercase mb-6 flex items-center gap-3 border-b border-slate-800 pb-4">
                <span class="w-3 h-8 bg-gradient-to-b from-cyan-400 to-emerald-400 rounded-full inline-block"></span>
                Xác Nhận & Thanh Toán Đơn Vé
            </h1>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- Left: Booking Info Summary -->
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">Chi Tiết Đơn Hàng</h3>
                    <div class="glass-card p-5 rounded-2xl border border-slate-800 space-y-3 text-xs">
                        <div class="flex justify-between">
                            <span class="text-slate-400">Tên phim:</span>
                            <span class="font-bold text-white text-right" id="pay-movie">Dune 2</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Rạp chiếu:</span>
                            <span class="font-bold text-white" id="pay-cinema">CGV Landmark 81</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Suất chiếu:</span>
                            <span class="font-bold text-white" id="pay-showtime">18:30 (Hôm nay)</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-slate-400">Ghế ngồi:</span>
                            <span class="font-bold text-cyan-400 text-sm" id="pay-seats">A1, A2</span>
                        </div>
                        <div class="pt-3 border-t border-slate-800 flex justify-between items-center">
                            <span class="text-xs font-bold uppercase text-slate-300">Tổng thanh toán:</span>
                            <span class="text-xl font-black text-emerald-400" id="pay-total">180.000 đ</span>
                        </div>
                    </div>

                    <!-- Customer Contact Details -->
                    <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider pt-2">Thông Tin Nhận Vé</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 mb-1">Họ và tên</label>
                            <input type="text" id="pay-name" placeholder="Nguyễn Văn A" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 focus:outline-none focus:border-cyan-500">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-400 mb-1">Email nhận vé điện tử</label>
                            <input type="email" id="pay-email" placeholder="customer@cinema.com" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-3 focus:outline-none focus:border-cyan-500">
                        </div>
                    </div>
                </div>

                <!-- Right: Payment Method Options -->
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-wider">Phương Thức Thanh Toán</h3>
                    
                    <div class="space-y-3">
                        <label class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between cursor-pointer hover:border-cyan-500 transition-all">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="payment-method" value="MOMO" checked class="text-cyan-500 focus:ring-0">
                                <div>
                                    <div class="text-xs font-bold text-white">Ví MoMo</div>
                                    <span class="text-[10px] text-slate-400">Quét mã QR MoMo tiện lợi</span>
                                </div>
                            </div>
                            <span class="text-rose-400 font-black text-sm">MoMo</span>
                        </label>

                        <label class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between cursor-pointer hover:border-cyan-500 transition-all">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="payment-method" value="VNPAY" class="text-cyan-500 focus:ring-0">
                                <div>
                                    <div class="text-xs font-bold text-white">VNPAY-QR</div>
                                    <span class="text-[10px] text-slate-400">Thẻ ATM / Internet Banking / QR</span>
                                </div>
                            </div>
                            <span class="text-blue-400 font-black text-sm">VNPAY</span>
                        </label>

                        <label class="glass-card p-4 rounded-2xl border border-slate-800 flex items-center justify-between cursor-pointer hover:border-cyan-500 transition-all">
                            <div class="flex items-center gap-3">
                                <input type="radio" name="payment-method" value="VISA" class="text-cyan-500 focus:ring-0">
                                <div>
                                    <div class="text-xs font-bold text-white">Thẻ Quốc Tế (Visa / Mastercard)</div>
                                    <span class="text-[10px] text-slate-400">Cổng thanh toán bảo mật 3D-Secure</span>
                                </div>
                            </div>
                            <i class="fa-brands fa-cc-visa text-xl text-slate-300"></i>
                        </label>
                    </div>

                    <div class="pt-6">
                        <button onclick="handleConfirmPayment()" class="w-full py-4 rounded-xl bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-400/25 hover:brightness-110 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-lock"></i>
                            <span>HOÀN TẤT THANH TOÁN</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/utils/storage.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/services/auth.service.js"></script>

    <script>
        let bookingData = null;

        function loadBookingInfo() {
            const raw = sessionStorage.getItem('current_booking');
            if (raw) {
                try {
                    bookingData = JSON.parse(raw);
                } catch(e) {}
            }

            if (!bookingData) {
                bookingData = {
                    movieTitle: 'Dune: Hành Tinh Cát 2',
                    cinema: 'CGV Landmark 81',
                    showtime: '18:30 (Hôm nay)',
                    seats: ['A1', 'A2'],
                    totalPrice: 180000
                };
            }

            document.getElementById('pay-movie').innerText = bookingData.movieTitle;
            document.getElementById('pay-cinema').innerText = bookingData.cinema;
            document.getElementById('pay-showtime').innerText = bookingData.showtime;
            document.getElementById('pay-seats').innerText = Array.isArray(bookingData.seats) ? bookingData.seats.join(', ') : bookingData.seats;
            document.getElementById('pay-total').innerText = Number(bookingData.totalPrice).toLocaleString('vi-VN') + ' đ';

            // Điền thông tin user nếu đã đăng nhập
            if (window.StorageService && window.StorageService.isAuthenticated()) {
                const user = window.StorageService.getUser();
                if (user) {
                    document.getElementById('pay-name').value = user.full_name || '';
                    document.getElementById('pay-email').value = user.email || '';
                }
            }
        }

        function handleConfirmPayment() {
            const name = document.getElementById('pay-name').value.trim();
            const email = document.getElementById('pay-email').value.trim();

            if (!name || !email) {
                alert('Vui lòng nhập Họ tên và Email để nhận vé!');
                return;
            }

            alert(`🎉 THANH TOÁN THÀNH CÔNG!\n\nVé xem phim "${bookingData.movieTitle}" (${bookingData.seats.join(', ')}) đã được gửi tới email ${email}.\nChúc bạn có buổi xem phim vui vẻ tại CINEMA 3D!`);
            sessionStorage.removeItem('current_booking');
            window.location.href = '../index.html';
        }

        window.onload = loadBookingInfo;
    </script>
</body>
</html>
