<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - LUMEN CINEMA</title>
    <!-- Favicon / Tab Icon -->
    <link rel="icon" type="image/png" href="../assets/images/logo/favicon.png">
    <link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.ico">
    <link rel="apple-touch-icon" href="../assets/images/logo/apple-touch-icon.png">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { dark: '#0b0d12', surface: '#131722', card: '#131722', tangerine: '#ff5e1e', lime: '#d4ff00', violet: '#7c3aed' }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0d12; color: #f8fafc; }
    .glass-panel { background: rgba(19, 23, 34, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .form-control.is-invalid { border-color: #ef4444 !important; background-color: rgba(239, 68, 68, 0.05); }
    .auth-alert-box { display: none; padding: 0.75rem 1rem; border-radius: 0.75rem; font-size: 13px; margin-bottom: 1rem; }
    .auth-alert-box.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .auth-alert-box.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  
  <!-- Glow backgrounds -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-[#ff5e1e]/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-[#d4ff00]/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="glass-panel w-full max-w-md p-8 sm:p-10 rounded-3xl border border-slate-700/80 shadow-2xl relative z-10">
    <div class="text-center mb-8">
      <a href="../index.html" class="inline-flex items-center gap-3 mb-3 group">
        <img src="../assets/images/logo/logo.png" alt="LUMEN CINEMA" class="w-12 h-12 object-contain drop-shadow-[0_0_15px_rgba(255,180,0,0.5)] group-hover:scale-105 transition-transform duration-300">
        <div class="flex flex-col text-left">
          <span class="text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-[#ff5e1e] via-[#d4ff00] to-white">
            LUMEN<span class="text-white font-light">CINEMA</span>
          </span>
          <span class="text-[9px] uppercase tracking-widest text-[#d4ff00] -mt-1 font-semibold">Studio & Theater HQ</span>
        </div>
      </a>
      <h1 class="text-xl font-black text-white uppercase tracking-wider mt-1">ĐĂNG NHẬP HỆ THỐNG</h1>
      <p class="text-xs text-slate-400 mt-0.5">Hệ thống rạp điện ảnh LUMEN CINEMA</p>
    </div>

    <!-- Alert Box -->
    <div class="auth-alert-box error" id="auth-alert"></div>

    <form id="login-form" novalidate onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" for="login-email">Email đăng nhập</label>
        <div class="relative">
          <input type="email" id="login-email" class="form-control w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl py-3 pl-10 pr-4 focus:outline-none focus:border-[#ff5e1e] transition-colors" placeholder="user@example.com" autocomplete="email">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-xs text-slate-500"></i>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5" for="login-password">Mật khẩu</label>
        <div class="relative">
          <input type="password" id="login-password" class="form-control w-full bg-slate-900/90 border border-slate-700 text-slate-200 text-xs rounded-xl py-3 pl-10 pr-10 focus:outline-none focus:border-[#ff5e1e] transition-colors" placeholder="••••••••" autocomplete="current-password">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-xs text-slate-500"></i>
          <button type="button" class="absolute right-3 top-3 text-xs text-slate-500 hover:text-slate-300" onclick="togglePasswordVisibility('login-password', this)">👁️</button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
          <input type="checkbox" id="login-remember" checked class="rounded text-[#ff5e1e] focus:ring-0">
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="#" onclick="alert('Vui lòng liên hệ Admin để khôi phục mật khẩu!')" class="text-[#ff5e1e] hover:underline">Quên mật khẩu?</a>
      </div>

      <button type="submit" id="btn-login-submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#ff5e1e] to-[#ea580c] text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-[#ff5e1e]/30 hover:brightness-110 transition-all mt-4">
        🔐 ĐĂNG NHẬP
      </button>
    </form>

    <!-- Test Quick Fill -->
    <div class="mt-6 p-4 rounded-2xl bg-slate-900/70 border border-slate-800 text-[11px]">
      <span class="font-bold text-slate-300 block mb-2">⚡ Điền tài khoản mẫu có sẵn:</span>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" onclick="quickFillAdmin()" class="py-1.5 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold border border-slate-700">
          👑 Admin
        </button>
        <button type="button" onclick="quickFillCustomer()" class="py-1.5 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold border border-slate-700">
          👤 Khách hàng
        </button>
      </div>
    </div>

    <div class="text-center mt-6 text-xs text-slate-400">
      Chưa có tài khoản? <a href="register.html" class="text-[#ff5e1e] font-bold hover:underline">Đăng ký ngay</a>
    </div>

    <div class="text-center mt-4">
      <a href="../index.html" class="text-xs text-slate-500 hover:text-slate-300">← Quay về Trang chủ</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/config/api.js"></script>
  <script src="../js/utils/validation.js"></script>
  <script src="../js/services/auth.service.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
