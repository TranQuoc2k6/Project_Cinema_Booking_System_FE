<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập Hệ thống - Cinema Booking System</title>
  
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-lg);
      background: radial-gradient(circle at 50% 20%, rgba(229, 9, 20, 0.15) 0%, rgba(11, 17, 32, 1) 70%);
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-2xl) var(--spacing-xl);
      box-shadow: var(--shadow-lg), var(--shadow-glow);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #e50914, #990000);
      border-radius: var(--border-radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: var(--spacing-md);
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
    }

    .demo-accounts-box {
      margin-top: var(--spacing-xl);
      padding: var(--spacing-md);
      background: rgba(15, 23, 42, 0.7);
      border: 1px dashed var(--border-light);
      border-radius: var(--border-radius-md);
      font-size: var(--font-xs);
    }

    .demo-btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-sm);
    }

    .auth-alert-box {
      display: none;
      padding: 0.75rem 1rem;
      background: var(--color-danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      border-radius: var(--border-radius-md);
      font-size: var(--font-sm);
      margin-bottom: var(--spacing-md);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🎬</div>
        <h1 style="font-size: 1.6rem; color: #fff; margin-bottom: 0.25rem;">CINEMA BOOKING</h1>
        <p style="font-size: 13px; color: var(--text-muted);">Đăng nhập tài khoản để tiếp tục</p>
      </div>

      <!-- HỘP THÔNG BÁO TỪ ROUTE GUARD (NẾU BỊ CHẶN) -->
      <div class="auth-alert-box" id="auth-alert"></div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="login-email">Email đăng nhập</label>
          <input type="email" id="login-email" class="form-control" required placeholder="admin@cinema.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login-submit" style="width: 100%; margin-top: var(--spacing-md);">
          <span>🔐</span> Đăng nhập
        </button>
      </form>

      <!-- TEST ROUTE GUARD: TÀI KHOẢN MẪU SPRINT 1 -->
      <div class="demo-accounts-box">
        <div style="font-weight: 700; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
          <span>🧪</span> KIỂM THỬ PHÂN QUYỀN (FE ROUTE GUARD & BE REQUIRE_ADMIN):
        </div>
        <p style="color: var(--text-sub); margin-bottom: 8px;">
          Bấm 1 chạm để điền tài khoản mẫu đã seed trong CSDL:
        </p>
        <div class="demo-btn-group">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFillAdmin()">
            <span>👑</span> Admin (Hợp lệ)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFillCustomer()">
            <span>👤</span> Khách (Test Chặn)
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: var(--spacing-lg); font-size: 13px;">
        <a href="../index.html" style="color: var(--text-muted); hover: color: #fff;">← Quay về trang chủ đặt vé</a>
      </div>
    </div>
  </div>

  <script src="../js/pages/login.js"></script>
</body>
</html>
